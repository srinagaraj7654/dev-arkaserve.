    <!-- OAuth relay: return native OAuth callbacks to the app before React loads. -->
    <script>
      if (location.pathname === '/login-callback') {
        var p = location.hash.slice(1) || location.search.slice(1);
        var ua = navigator.userAgent;
        if (p && /Android/i.test(ua)) {
          location.replace(
            'intent://login-callback?' + p +
            '#Intent;scheme=com.arkaserve.prep;package=com.arkaserve.prep;' +
            'S.browser_fallback_url=' + encodeURIComponent('https://prep.arkaserve.com') + ';end'
          );
        } else if (p && /iPhone|iPad|iPod/i.test(ua)) {
          location.replace('com.arkaserve.prep://login-callback?' + p);
        }
      }
    </script>

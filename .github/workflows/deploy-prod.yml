name: Deploy → Production (nifty)

on:
  push:
    branches: [main]

# Never cancel an in-flight production deploy
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & deploy to nifty (129.154.254.119)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # .env.production is gitignored; write it fresh from CI secrets.
      - name: Create .env.production
        run: |
          {
            echo "VITE_SUPABASE_URL=https://akumbbnjqnimfiqjcnve.supabase.co"
            echo "VITE_SUPABASE_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"
            echo "VITE_API_URL=https://129-154-254-119.sslip.io"
            echo "VITE_APP_ENV=production"
            echo "VITE_ADMIN_KEY=mocktest-admin-2026"
          } > .env.production

      - name: Build (production mode)
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan -H 129.154.254.119 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync dist/ to production server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/oci_key -o StrictHostKeyChecking=no" \
            dist/ \
            opc@129.154.254.119:/var/www/html/mocktest-web/

      - name: Reload nginx
        run: |
          ssh -i ~/.ssh/oci_key -o StrictHostKeyChecking=no opc@129.154.254.119 \
            "sudo nginx -s reload"

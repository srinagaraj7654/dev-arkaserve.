name: Deploy → Dev Server

on:
  push:
    branches: [dev]

# Cancel in-flight dev deploys when a new commit arrives
concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & deploy to mocktest-dev (137.23.53.225)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build in "staging" Vite mode but point API at the dev server IP.
      # .env.staging is gitignored so we write it fresh from CI secrets.
      - name: Create .env.staging (dev-server values)
        run: |
          {
            echo "VITE_SUPABASE_URL=https://akumbbnjqnimfiqjcnve.supabase.co"
            echo "VITE_SUPABASE_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"
            echo "VITE_API_URL=http://137.23.53.225"
            echo "VITE_APP_ENV=development"
            echo "VITE_ADMIN_KEY=mocktest-admin-2026"
          } > .env.staging

      - name: Build (staging mode → dev server)
        run: npm run build:staging

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan -H 137.23.53.225 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync dist/ to dev server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/oci_key -o StrictHostKeyChecking=no" \
            dist/ \
            opc@137.23.53.225:/var/www/html/mocktest-web/

      - name: Reload nginx
        run: |
          ssh -i ~/.ssh/oci_key -o StrictHostKeyChecking=no opc@137.23.53.225 \
            "sudo nginx -s reload"

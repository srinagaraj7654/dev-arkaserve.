# ─────────────────────────────────────────────────────────────────────────────
# CI / CD Pipeline
#
# Triggers:
#   push to dev   → build staging  → deploy to Vercel staging project
#   push to main  → build prod     → deploy to Vercel production project
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   VERCEL_TOKEN          — from vercel.com → Account Settings → Tokens
#   VERCEL_ORG_ID         — from .vercel/project.json after first `vercel link`
#   VERCEL_PROJECT_ID_PROD    — production Vercel project ID
#   VERCEL_PROJECT_ID_STAGING — staging Vercel project ID
# ─────────────────────────────────────────────────────────────────────────────

name: CI / CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ── 1. Build & validate ──────────────────────────────────────────────────────
  build:
    name: Build (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (staging)
        if: github.ref_name == 'dev'
        run: npm run build:staging
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_ENV: staging

      - name: Build (production)
        if: github.ref_name == 'main'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_ENV: production

  # ── 2. Deploy to Vercel staging (dev branch only) ────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel (staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_STAGING }}
          vercel-args: --prod
          working-directory: ./

  # ── 3. Deploy to Vercel production (main branch only) ───────────────────────
  deploy-production:
    name: Deploy → Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
          vercel-args: --prod
          working-directory: ./
